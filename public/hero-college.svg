  <rect x="620" y="320" width="36" height="300" fill="#E8E2D4" stroke="#1E4D7B" stroke-width="2"/>
  <rect x="944" y="320" width="36" height="300" fill="#E8E2D4" stroke="#1E4D7B" stroke-width="2"/>
  <rect x="1084" y="320" width="36" height="300" fill="#E8E2D4" stroke="#1E4D7B" stroke-width="2"/>
