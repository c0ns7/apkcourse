  <rect x="700" y="360" width="200" height="260" fill="#1E4D7B"/>
  <path d="M720 620 L720 420 Q800 360 880 420 L880 620 Z" fill="#153A5C"/>
  <rect x="760" y="480" width="80" height="140" fill="#0F2A44"/>
