    <rect x="540" y="340" width="70" height="90"/>
    <rect x="990" y="340" width="70" height="90"/>
    <rect x="1090" y="340" width="70" height="90"/>
    <rect x="440" y="470" width="70" height="90"/>
    <rect x="540" y="470" width="70" height="90"/>
    <rect x="990" y="470" width="70" height="90"/>
