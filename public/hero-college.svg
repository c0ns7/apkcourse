<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="40=85 ?5403>38G5A:>3> :>;;5460">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8EB8D8"/>
      <stop offset="55%" stop-color="#C5D9E8"/>
      <stop offset="100%" stop-color="#E8EEF2"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
